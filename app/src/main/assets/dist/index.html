@路人甲: (饰演黑术暗影君王)此片世界时空有点不太稳定（在宇宙之外看着）这人貌似能承载我的力量
### 旁白引导剧情
@旁白：你在这片天地探索，前面看见一些人影

### 遇见与交流
随机 遇见各种npc,也就是随机编排以下角色进行发言: @薰儿（萧薰儿|古薰儿） @纳兰嫣然 @海波东（冰皇） @美杜莎  @路人甲（扮演 闪人，旅人等）
